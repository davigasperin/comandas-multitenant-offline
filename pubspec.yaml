name: comandas_app
description: Sistema multi-tenant de gestão de comandas e pedidos para bares e restaurantes.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Local storage (token, tenant selecionado, cache)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.5

  # Utilitários
  intl: ^0.19.0
  equatable: ^2.0.5
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
